<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indice de recherche — vos stats GitHub en avis de recherche</title>
    <meta name="description" content="Transformez vos stats GitHub en avis de recherche à partager sur LinkedIn." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="layout">
      <section class="panel">
        <p class="eyebrow">Stats GitHub · GTA VI</p>
        <h1>Indice de <span>recherche</span></h1>
        <p class="lead">
          Entrez un identifiant GitHub. Vos commits, étoiles et pull requests deviennent un avis de
          recherche, de une à six étoiles.
        </p>

        <form id="form" class="form" novalidate>
          <label for="login">Identifiant GitHub</label>
          <div class="field">
            <span aria-hidden="true">@</span>
            <input id="login" name="login" type="text" placeholder="Lucia" autocomplete="off"
              autocapitalize="none" spellcheck="false" maxlength="39" required />
            <button type="submit" id="submit">Trouver l'avis</button>
          </div>
          <p id="status" class="status" role="status" aria-live="polite"></p>
        </form>

        <div class="actions" id="actions" hidden>
          <button type="button" id="download" class="primary icon" aria-label="Télécharger la carte en PNG" title="Télécharger la carte">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 4v11" />
              <path d="M7 11l5 5 5-5" />
              <path d="M5 20h14" />
            </svg>
          </button>
        </div>
      </section>

      <section class="stage" aria-label="Aperçu de la carte">
        <canvas id="card" width="1080" height="1350" role="img" aria-label="Carte avis de recherche"></canvas>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
